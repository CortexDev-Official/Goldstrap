name: CI (Release)

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore Goldstrap.sln

    - name: Build
      run: dotnet build Goldstrap.sln -c Release --no-restore

    - name: Publish
      run: dotnet publish Bloxstrap/Goldstrap.csproj -p:PublishSingleFile=true -p:CommitHash=${{ github.sha }} -p:CommitRef=${{ github.ref_type }}/${{ github.ref_name }} -r win-x64 -c Release --self-contained false

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: Goldstrap
        path: Bloxstrap/bin/Release/net6.0-windows/win-x64/publish/Goldstrap.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
    - name: Download artifact
      uses: actions/download-artifact@v8
      with:
        name: Goldstrap
        path: release

    - name: Create release
      uses: softprops/action-gh-release@v3
      with:
        draft: true
        name: Goldstrap ${{ github.ref_name }}
        files: release/**/Goldstrap.exe
        fail_on_unmatched_files: true

  release-test:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/release-test')
    permissions:
      contents: write

    steps:
    - name: Download artifact
      uses: actions/download-artifact@v8
      with:
        name: Goldstrap
        path: release

    - name: Create release
      uses: softprops/action-gh-release@v3
      with:
        draft: true
        name: Goldstrap ${{ github.ref_name }}
        files: release/**/Goldstrap.exe
        fail_on_unmatched_files: true
