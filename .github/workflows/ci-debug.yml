name: CI (Debug)

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore Goldstrap.sln

    - name: Build
      run: dotnet build Goldstrap.sln -c Debug --no-restore

    - name: Publish
      run: dotnet publish Bloxstrap/Goldstrap.csproj -p:PublishSingleFile=true -p:CommitHash=${{ github.sha }} -p:CommitRef=${{ github.ref_type }}/${{ github.ref_name }} -r win-x64 -c Debug --self-contained false

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: Goldstrap-Debug
        path: Bloxstrap/bin/Debug/net6.0-windows/win-x64/publish/Goldstrap.exe
