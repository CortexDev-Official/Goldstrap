name: Publish to Winget

on:
  release:
    types: [released]

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e
        with:
          identifier: Goldstrap.Goldstrap
          token: ${{ secrets.WINGET_TOKEN }}
