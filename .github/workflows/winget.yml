name: Publish to Winget

on:
  release:
    types: [released]

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54
        with:
          identifier: Goldstrap.Goldstrap
          token: ${{ secrets.WINGET_TOKEN }}
